name: Build CellSmith (Linux)
description: >
  The COMPLETE Linux release build — free space, system libs, conda env,
  `make build` (freeze + tar.gz + .deb), payload verification, artifact
  assertion. Shared verbatim by the PR gate and the release workflow.

# WHY THIS IS A COMPOSITE ACTION AND NOT TWO COPIES OF THE STEPS
#     The PR gate used to run PyInstaller ONLY — no tar.gz, no .deb — to keep it
#     ~15 min shorter. That made every packaging defect invisible until the
#     release build, which is the most expensive place to find one. Two of them
#     landed that way in a row:
#
#       * make_deb.sh died with `printf: write error: Broken pipe` on the first
#         REAL payload (a `printf | grep -q` over a 200 kB file listing).
#       * the version guard had never worked (an unanchored parse), in two
#         inlined copies that were wrong identically.
#
#     Same lesson both times: a step the gate does not run is a step nobody has
#     tested, and a step duplicated in two workflows drifts. So the gate now runs
#     the release build, and there is exactly ONE definition of what that is.
#     Everything release-SPECIFIC (collecting and uploading artifacts, tagging)
#     stays in release.yml — this action stops at "the artifacts exist and are
#     sound", which is precisely the part worth catching early.

runs:
  using: composite
  steps:
    - name: Free disk space
      # The conda env + build/ + dist/ + the tarball + the .deb approach the
      # runner's ~20-29 GB of free space. Reclaim the preinstalled toolchains we
      # do not use rather than discovering "no space left" mid-archive.
      shell: bash -el {0}
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                    /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        df -h /
    - name: Install the system libraries PySide6/VTK/OCC link against
      # ⭐ BEFORE the build: PyInstaller's Qt hook imports PySide6 at build time;
      # if that import fails it silently collects NO Qt plugins. See
      # Reference/packaging.md and the verify step below.
      # dpkg-dev + fakeroot are what `make deb` needs.
      shell: bash -el {0}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
          libxcb-xkb1 libxkbcommon-x11-0 libgl1 libegl1 libfontconfig1 \
          libdbus-1-3 libxrender1 libxext6 libsm6 libice6 libglib2.0-0t64 \
          libwayland-client0 libwayland-cursor0 libwayland-egl1 libx11-xcb1 \
          libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcursor1 libxi6 \
          libxinerama1 \
          dpkg-dev fakeroot
    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: packaging/environment.yml
        activate-environment: CellSmithEnv
        auto-activate: false        # `auto-activate-base` is deprecated
        conda-remove-defaults: true # env pins conda-forge ONLY (see environment.yml)
    - name: Build tar.gz + .deb
      # `make build` freezes, tars, then invokes the `deb` target. The
      # third-party notices are generated by the spec itself — no step needed.
      shell: bash -el {0}
      run: make build
    - name: Verify the payload is usable
      shell: bash -el {0}
      run: bash .github/scripts/verify-payload.sh dist/CellSmith CellSmith
    - name: Assert both Linux artifacts were produced
      # Cheap, and it belongs HERE rather than in release.yml's collect step: a
      # missing artifact is a build defect, so the gate must see it too.
      shell: bash -el {0}
      run: |
        set -uo pipefail
        rc=0
        for pat in "dist/CellSmith-v*-linux-x86_64.tar.gz" "dist/cellsmith_*_amd64.deb"; do
          if compgen -G "$pat" > /dev/null; then
            echo "  ok    $(ls -lh $pat | awk '{print $NF, "("$5")"}')"
          else
            echo "::error::no artifact matching $pat — see the build log"; rc=1
          fi
        done
        exit $rc
