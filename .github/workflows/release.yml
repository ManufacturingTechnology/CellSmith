name: Release

# Fires on pushes to release/* that modify src/__version__.py — see
# CONTRIBUTING.md → Triggering a release. The path filter means non-version
# commits on a release branch (dependency bumps, doc fixes) do not release.
on:
  push:
    branches: ['release/*']
    paths: ['src/__version__.py']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
      minor: ${{ steps.derive.outputs.minor }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      should_release: ${{ steps.derive.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: derive
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"

          version=$(grep -oP '"\K[^"]+' src/__version__.py)
          if [ -z "$version" ]; then
            echo "::error::Failed to parse __version__ from src/__version__.py"
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::__version__ '$version' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi

          tag="v$version"

          if [[ "$branch" =~ ^release/([0-9]+)\.([0-9]+)$ ]]; then
            expected_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            actual_minor=$(echo "$version" | cut -d'-' -f1 | cut -d. -f1-2)
            if [ "$expected_minor" != "$actual_minor" ]; then
              echo "::error::Branch '$branch' expects version $expected_minor.x, but __version__ is '$version'"
              exit 1
            fi
          else
            echo "::error::Branch '$branch' is not a release branch (expected 'release/X.Y')"
            exit 1
          fi

          # Semver: a `-` suffix marks a prerelease.
          if [[ "$tag" == *-* ]]; then prerelease=true; else prerelease=false; fi

          # On `push`, skip if the tag already exists on the remote — this commit
          # didn't actually bump the version. On `workflow_dispatch`, always
          # proceed so a broken release can be re-run.
          should_release=true
          if [ "${{ github.event_name }}" = "push" ]; then
            if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag"; then
              echo "::notice::Tag $tag already exists on remote — skipping (use workflow_dispatch to re-run)"
              should_release=false
            fi
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "minor=$expected_minor"
            echo "prerelease=$prerelease"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

          echo "Branch:         $branch"
          echo "Version:        $version"
          echo "Tag:            $tag"
          echo "Prerelease:     $prerelease"
          echo "Should release: $should_release"

  build-linux:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The conda env + build/ + dist/ + the tarball + the .deb approach the
        # runner's ~20-29 GB of free space. Reclaim the preinstalled toolchains we
        # do not use rather than discovering "no space left" mid-archive.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Install the system libraries PySide6/VTK/OCC link against
        # ⭐ BEFORE the build: PyInstaller's Qt hook imports PySide6 at build time;
        # if that import fails it silently collects NO Qt plugins. See
        # Reference/packaging.md and the verify step below.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xkb1 libxkbcommon-x11-0 libgl1 libegl1 libfontconfig1 \
            libdbus-1-3 libxrender1 libxext6 libsm6 libice6 libglib2.0-0t64 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libx11-xcb1 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcursor1 libxi6 \
            libxinerama1 \
            dpkg-dev fakeroot
      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: packaging/environment.yml
          activate-environment: CellSmithEnv
          auto-activate: false        # `auto-activate-base` is deprecated
          conda-remove-defaults: true # env pins conda-forge ONLY (see environment.yml)
      - name: Build tar.gz + .deb
        # `make build` freezes, tars, then invokes the `deb` target. The
        # third-party notices are generated by the spec itself — no step needed.
        run: make build
      - name: Verify the payload is usable
        run: bash .github/scripts/verify-payload.sh dist/CellSmith CellSmith
      - name: Collect the artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/CellSmith-v*-linux-x86_64.tar.gz out/
          mv dist/cellsmith_*_amd64.deb out/
          # Free the payload before upload — 972 MB that nothing downstream needs.
          rm -rf dist/CellSmith build
          ls -la out/
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*
          if-no-files-found: error
          compression-level: 0    # both are already compressed

  build-windows:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - name: Report free disk space
        shell: pwsh
        run: Get-PSDrive C | Format-List Used, Free
      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: packaging/environment.yml
          activate-environment: CellSmithEnv
          auto-activate: false        # `auto-activate-base` is deprecated
          conda-remove-defaults: true # env pins conda-forge ONLY (see environment.yml)
      - name: Put conda on PATH for cmd
        # build.bat / dev.bat call bare `conda`, which setup-miniconda only wires
        # into the bash/pwsh profiles. Without this the `shell: cmd` step below
        # fails at dev.bat's `where conda` check.
        shell: bash
        run: dirname "$(which conda)" >> "$GITHUB_PATH"
      - name: Locate the Inno Setup compiler
        # Inno Setup 6 IS preinstalled on windows-latest, but the runner-image
        # manifest does not document its PATH and build.bat only WARNS when it
        # cannot find ISCC. Find it deliberately, fail here if absent, and hand the
        # absolute path to build.bat via %ISCC% (which it honours over its probing).
        shell: pwsh
        run: .github/scripts/find-iscc.ps1
      - name: Build zip + installer
        # `build.bat ci` runs the full pipeline: env check, PyInstaller, the robust
        # zip, then Inno Setup using the %ISCC% exported above.
        shell: cmd
        run: build.bat ci
      - name: Verify the payload is usable
        run: bash .github/scripts/verify-payload.sh dist/CellSmith CellSmith.exe
      - name: Collect the artifacts
        # ⭐ build.bat only WARNS and continues when ISCC is not found, so a missing
        # installer would otherwise pass silently. Fail loudly instead.
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/CellSmith-v*-win64.zip out/
          if ! compgen -G "dist/CellSmith-v*-setup.exe" > /dev/null; then
            echo "::error::No installer was produced. build.bat skips Inno Setup with only a warning when ISCC is not found — check the build log for 'Inno Setup 6 not found'."
            exit 1
          fi
          mv dist/CellSmith-v*-setup.exe out/
          rm -rf dist/CellSmith build
          ls -la out/
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [version, build-linux, build-windows]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: List and sanity-check the artifacts
        # GitHub caps an individual release asset at 2 GiB (up to 1000 assets per
        # release; no cap on the release total). Our largest is ~500 MB, but assert
        # it so a future payload growth fails here rather than at upload.
        run: |
          set -euo pipefail
          ls -la artifacts/
          limit=$((2 * 1024 * 1024 * 1024))
          fail=0
          for f in artifacts/*; do
            size=$(stat -c%s "$f")
            printf '  %-52s %6s MiB\n' "$(basename "$f")" "$((size / 1024 / 1024))"
            if [ "$size" -ge "$limit" ]; then
              echo "::error::$(basename "$f") is $((size / 1024 / 1024)) MiB — GitHub's per-asset limit is 2 GiB"
              fail=1
            fi
          done
          # Exactly the four shipped artifacts, no more, no fewer.
          for pattern in 'CellSmith-v*-win64.zip' 'CellSmith-v*-setup.exe' \
                         'CellSmith-v*-linux-x86_64.tar.gz' 'cellsmith_*_amd64.deb'; do
            if ! compgen -G "artifacts/$pattern" > /dev/null; then
              echo "::error::missing expected release asset: $pattern"
              fail=1
            fi
          done
          exit $fail
      - name: Create and push tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on remote — reusing"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Create dev/X.Y staging branch for this line
        env:
          DEV: dev/${{ needs.version.outputs.minor }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Seeded from the first *stable* release of the line so it never lags
          # release/X.Y at a prerelease commit.
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::${{ needs.version.outputs.tag }} is a prerelease — $DEV is created on the first stable release, skipping"
            exit 0
          fi
          if git ls-remote --heads origin "refs/heads/$DEV" | grep -q "refs/heads/$DEV"; then
            echo "::notice::$DEV already exists — leaving it untouched"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git push origin "HEAD:refs/heads/$DEV"
            echo "::notice::Created $DEV at $GITHUB_SHA"
          fi
